name: Tag

# Steigt die Version in extension/manifest.json, bekommt der Commit auf main das Tag
# v<Version> samt GitHub-Release, dessen Notizen die PR-Titel seit dem vorigen Tag auflisten.
# Gibt es das Tag schon, passiert nichts.
on:
  push:
    branches: [main]
    paths: [extension/manifest.json]

permissions:
  contents: write

jobs:
  tag:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      # gh release create legt Tag und Release in einem Schritt an, so bleibt kein Tag ohne Release zurück
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./extension/manifest.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag gibt es schon"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --generate-notes
          fi
