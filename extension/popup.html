<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="error" class="error" role="alert" hidden></div>
  <div id="backup-error" class="error" hidden></div>
  <fieldset id="controls">
    <ul id="list" aria-label="Workspaces"></ul>
    <button id="add" class="add" type="button" data-focus="add" data-i18n="newWorkspace"></button>
    <button id="transfer" class="add" type="button" data-focus="transfer" data-i18n="openTransfer"></button>
    <label class="option" data-i18n-title="muteStashTitle"><input id="mute-stash" type="checkbox" data-focus="mute-stash"> <span data-i18n="muteStash"></span></label>
    <label class="setting"><span data-i18n="unloadAfter"></span> <select id="unload" data-focus="unload"></select></label>
  </fieldset>
  <details class="key">
    <summary data-i18n="keySummary"></summary>
    <div class="key-line"><code id="key-value"></code><button id="key-copy" class="btn" type="button" disabled data-i18n="copy"></button></div>
  </details>
  <footer><span class="hint" data-i18n="popupHint"></span><span id="status" role="status"></span><span id="version" class="version" data-i18n-title="versionTitle"></span></footer>
  <script src="i18n.js"></script>
  <script src="label.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
