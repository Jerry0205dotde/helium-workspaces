<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="transferTitle"></title>
<link rel="stylesheet" href="transfer.css">
</head>
<body>
<main>
  <h1 data-i18n="transferTitle"></h1>

  <section>
    <h2 data-i18n="exportHeading"></h2>
    <p class="muted" data-i18n="exportText"></p>
    <button id="export" class="btn primary" data-i18n="exportButton"></button>
    <p id="export-result" class="result" role="status"></p>
  </section>

  <section>
    <h2 data-i18n="autoHeading"></h2>
    <p id="auto-text" class="muted"></p>
    <label class="setting"><span data-i18n="autoLabel"></span> <select id="auto"></select></label>
    <div id="auto-error" class="error" role="alert" hidden></div>
    <p id="auto-info" class="result muted" role="status"></p>
  </section>

  <section>
    <h2 data-i18n="importHeading"></h2>
    <p class="muted" data-i18n="importText"></p>
    <input id="file" type="file" accept=".json,application/json">
    <div id="error" class="error" role="alert" hidden></div>
    <div id="preview" hidden>
      <p id="summary"></p>
      <ul id="file-list" class="ws-list"></ul>

      <fieldset class="modes">
        <legend data-i18n="modesLegend"></legend>
        <label class="mode">
          <input type="radio" name="mode" value="merge" checked>
          <span><strong data-i18n="mergeName"></strong> – <span data-i18n="mergeText"></span></span>
        </label>
        <ul id="merge-list" class="plan"></ul>
        <label class="mode">
          <input type="radio" name="mode" value="replace">
          <span><strong data-i18n="replaceName"></strong> – <span data-i18n="replaceText"></span></span>
        </label>
        <ul id="replace-list" class="plan"></ul>
      </fieldset>

      <button id="import" class="btn primary" data-i18n="importButton"></button>
    </div>
    <p id="import-result" class="result" role="status"></p>
  </section>
  <p id="status" class="muted" role="status"></p>
</main>
<script src="i18n.js"></script>
<script src="label.js"></script>
<script src="ui.js"></script>
<script src="transfer.js"></script>
</body>
</html>
