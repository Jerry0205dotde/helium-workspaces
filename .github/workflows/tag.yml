name: Tag

# Steigt die Version in extension/manifest.json, bekommt der Commit auf main das Tag
# v<Version> samt GitHub-Release, dessen Notizen die PR-Titel seit dem vorigen Tag auflisten.
# Am Release hängt das Paket für den Chrome Web Store. Gibt es das Tag schon, passiert nichts.
on:
  push:
    branches: [main]
    paths: [extension/manifest.json]

permissions:
  contents: write

jobs:
  tag:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      # gh release create legt Tag und Release in einem Schritt an, so bleibt kein Tag ohne Release zurück
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./extension/manifest.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag gibt es schon"
          else
            # Paket für den Chrome Web Store (#51): extension/ ohne das Feld key, denn der Store
            # nimmt kein Manifest mit key an und vergibt eine eigene ID. Vor dem Release gebaut,
            # damit es kein Release ohne Paket gibt
            pkg="$RUNNER_TEMP/webstore"
            zip="$RUNNER_TEMP/helium-workspaces-$tag-webstore.zip"
            cp -r extension "$pkg"
            node -e 'const fs = require("fs"), f = process.argv[1], m = JSON.parse(fs.readFileSync(f, "utf8"));
              delete m.key; fs.writeFileSync(f, JSON.stringify(m, null, 2) + "\n")' "$pkg/manifest.json"
            (cd "$pkg" && zip -qrX "$zip" .)
            gh release create "$tag" "$zip" --target "$GITHUB_SHA" --generate-notes
          fi
