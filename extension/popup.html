<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="error" class="error" role="alert" hidden></div>
  <div id="backup-error" class="error" hidden></div>
  <fieldset id="controls">
    <ul id="list" aria-label="Workspaces"></ul>
    <button id="add" class="add" type="button" data-focus="add">＋ Neuer Workspace</button>
    <button id="transfer" class="add" type="button" data-focus="transfer">⇅ Exportieren / Importieren</button>
    <label class="option" title="Tabs in nicht gezeigten Workspaces spielen keinen Ton ab"><input id="mute-stash" type="checkbox" data-focus="mute-stash"> Ablagen stummschalten</label>
  </fieldset>
  <details class="key">
    <summary>Schlüssel für install.sh</summary>
    <div class="key-line"><code id="key-value"></code><button id="key-copy" class="btn" type="button" disabled>Kopieren</button></div>
  </details>
  <footer><span class="hint">↑ / ↓ und Enter oder Alt+Shift+↑ / ↓ wechseln · Rechtsklick auf Seite: Tab verschieben</span><span id="status" role="status"></span></footer>
  <script src="label.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
